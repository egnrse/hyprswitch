[package]
name = "hyprswitch"
description = "A CLI/GUI that allows switching between windows in Hyprland"
version = "4.0.1"
edition = "2021"
license = "MIT"
readme = "README.md"
authors = ["h3rmt", "egnrse"]
documentation = "https://docs.rs/crate/hyprswitch"
repository = "https://github.com/egnrse/hyprswitch/"
keywords = ["hyprland"]
categories = ["command-line-utilities"]

[dependencies]
hyprland = { version = "0.4.0-beta.2", features = ["async-lite", "dispatch", "keyword", "data", "listener"], default-features = false }
anyhow = "1.0"
async-channel = { version = "2.5", default-features = false }
bincode = "1.0"
clap = { version = "4.6", features = ["derive"] }
lazy_static = { version = "1.5" }
notify-rust = { version = "4.11", features = ["zbus", "serde"], default-features = true }
rand = "0.10"
regex = "1.13"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smart-default = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "fmt", "env-filter", "ansi"], default-features = false }

gtk4 = { version = "0.11", default-features = false, features = ["v4_6"] }
gtk4-layer-shell = { version = "0.8" }

ron = { version = "0.8", optional = true }

[dev-dependencies]
random_color = { version = "1.0", default-features = false }
svg = { version = "0.18", default-features = false }

[profile.release]
strip = "debuginfo"
lto = true
opt-level = "s"

[features]
default = []
config = ["ron"]
